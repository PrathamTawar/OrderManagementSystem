x-app: &app
  image: order-management-system:dev
  build:
    context: .
    target: runtime-dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}

services:
  migrate:
    <<: *app

    command:
      - python
      - manage.py
      - migrate
      - --noinput

    env_file:
      - .env.dev

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app

    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000

    env_file:
      - .env.dev

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery:
    <<: *app

    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO

    env_file:
      - .env.dev

    volumes:
      - .:/app

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    <<: *app

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO

    env_file:
      - .env.dev

    volumes:
      - .:/app

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    image: postgres:18.6

    env_file:
      - .env.dev

    volumes:
    - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2

    env_file:
      - .env.dev

    volumes:
      - redis_data:/data

    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --pass "$$REDIS_PASSWORD" ping
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: