[project]
name = "order-management-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "celery>=5.6.2",
    "redis>=8.1.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "django-cors-headers>=4.9.0",
    "djangorestframework-simplejwt>=5.5.1",
    "django-phonenumber-field[phonenumbers]>=8.5.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["I"]

